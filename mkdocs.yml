site_name: RPAForge Documentation
site_url: https://chelslava.github.io/rpaforge
site_author: RPAForge Contributors
site_description: Open Source RPA Studio - Visual automation builder

repo_name: chelslava/rpaforge
repo_url: https://github.com/chelslava/rpaforge

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chelslava/rpaforge

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - footnotes
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - Headless CLI: getting-started/headless-cli.md
  - SDK & Extension:
    - SDK Overview: sdk/index.md
    - Core API Reference: sdk/core-api.md
    - Engine & Process Builder: sdk/engine.md
    - Writing a Custom Library: sdk/writing-a-library.md
  - Built-in Libraries:
    - Overview: libraries/index.md
    - DesktopUI: libraries/desktopui.md
    - WebUI: libraries/webui.md
    - Excel: libraries/excel.md
    - Database: libraries/database.md
    - Credentials: libraries/credentials.md
    - OCR: libraries/ocr.md
    - DataFrames: libraries/dataframes.md
    - DateTime: libraries/datetime.md
    - File: libraries/file.md
    - Flow: libraries/flow.md
    - HTTP: libraries/http.md
    - String: libraries/string.md
    - Variables: libraries/variables.md
    - Spy: libraries/spy.md
  - Developer Guide:
    - Architecture: developer-guide/architecture.md
    - Building the Installer: developer-guide/building-installer.md
  - Troubleshooting:
    - Common Issues: troubleshooting/common-issues.md

plugins:
  - search
  - mike:
      alias_type: symlink
      canonical_version: latest
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/core/src
            - packages/libraries/src
