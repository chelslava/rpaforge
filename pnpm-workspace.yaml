packages:
  - 'packages/*'

overrides:
  brace-expansion: '>=5.0.8'
  dompurify: '>=3.4.11'
  fast-uri: '>=3.1.4'
  form-data: '>=4.0.6'
  postcss: '>=8.5.18'
  undici: '>=7.28.0'
  vite: '>=8.0.16'

allowBuilds:
  '@parcel/watcher': true
  electron-winstaller: true

onlyBuiltDependencies:
  - electron
  - esbuild
  - "@parcel/watcher"
  - electron-winstaller
