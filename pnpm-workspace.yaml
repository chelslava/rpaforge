packages:
  - 'packages/*'

overrides:
  '@xmldom/xmldom': '>=0.8.15'
  brace-expansion: '>=5.0.11'
  dompurify: '>=3.4.17'
  fast-uri: '>=4.1.4'
  form-data: '>=4.0.6'
  handlebars: '>=4.7.10'
  http-cache-semantics: '>=4.2.1'
  js-yaml: '>=5.4.1'
  nanoid: '>=3.3.17'
  postcss: '>=8.5.18'
  source-map-js: '>=1.2.2'
  tar: '>=7.5.21'
  undici: '>=8.12.2'
  vite: '>=8.2.4'
  zod: '>=4.6.6'

allowBuilds:
  '@parcel/watcher': true
  electron-winstaller: true

onlyBuiltDependencies:
  - electron
  - esbuild
  - "@parcel/watcher"
  - electron-winstaller
