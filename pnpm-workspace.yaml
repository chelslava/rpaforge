packages:
  - 'packages/*'

overrides:
  brace-expansion: '>=5.0.9'
  dompurify: '>=3.4.13'
  fast-uri: '>=4.1.2'
  form-data: '>=4.0.6'
  js-yaml: '>=4.3.1'
  nanoid: '>=3.3.17'
  postcss: '>=8.5.18'
  tar: '>=7.5.21'
  undici: '>=8.9.0'
  vite: '>=8.0.16'

allowBuilds:
  '@parcel/watcher': true
  electron-winstaller: true

onlyBuiltDependencies:
  - electron
  - esbuild
  - "@parcel/watcher"
  - electron-winstaller
