[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpaforge-libraries"
version = "0.5.0"
description = "RPA automation libraries for RPAForge"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "RPAForge Contributors"}
]
keywords = [
    "rpa",
    "automation",
    "desktop-automation",
    "web-automation",
    "ocr",
    "excel",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "rpaforge-core>=0.5.0,<0.6.0",
    "cryptography>=48.0,<51.0",
    "requests>=2.32.0,<3.0.0",
]

[project.optional-dependencies]
desktop = [
    "pywinauto>=0.6.8,<1.0.0",
    "pillow>=12.3.0,<13.0.0",
]
web = [
    "playwright>=1.40.0,<2.0.0",
]
ocr = [
    "pytesseract>=0.3.10,<1.0.0",
    "pyzbar>=0.1.9,<1.0.0",
    "pyautogui>=0.9.54,<1.0.0",
    "pillow>=12.3.0,<13.0.0",
]
excel = [
    "openpyxl>=3.1,<4.0",
]
database = [
    "sqlalchemy>=2.0,<3.0",
]
keystore = [
    "keyring>=24.0,<26.0",
]
spy = [
    "uiautomation>=2.0,<3.0",
    "websocket-client>=1.0,<2.0",
    "pynput>=1.7,<2.0",
]
dataframes = [
    "polars>=0.20,<2.0",
    "xlsxwriter>=3,<6",
]
idp = [
    "pypdf>=6.15.0,<7.0.0",
    "python-docx>=1.1,<2",
    "pillow>=12.3.0,<13.0.0",
    "pypdfium2>=4,<8",
    "pytesseract>=0.3.10,<1.0.0",
]
llm = [
    "httpx>=0.27",
    "pydantic>=2,<3",
]
all = [
    "rpaforge-libraries[desktop,web,ocr,excel,database,keystore,spy,dataframes,idp,llm]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-playwright>=0.4.0",
    "ruff>=0.15.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/chelslava/rpaforge"
Repository = "https://github.com/chelslava/rpaforge.git"
Issues = "https://github.com/chelslava/rpaforge/issues"

# Discovered by rpaforge-core's `discover_libraries()` via
# importlib.metadata.entry_points(group="rpaforge.libraries"). Third-party
# library packages register the same way in their own pyproject.toml — no
# changes to rpaforge-core are needed to add a library.
[project.entry-points."rpaforge.libraries"]
DesktopUI = "rpaforge_libraries.DesktopUI.library:DesktopUI"
Excel = "rpaforge_libraries.Excel.library:Excel"
File = "rpaforge_libraries.File.library:File"
Flow = "rpaforge_libraries.Flow.library:Flow"
HTTP = "rpaforge_libraries.HTTP.library:HTTP"
String = "rpaforge_libraries.String.library:String"
DateTime = "rpaforge_libraries.DateTime.library:DateTime"
Variables = "rpaforge_libraries.Variables.library:Variables"
WebUI = "rpaforge_libraries.WebUI.library:WebUI"
DataFrames = "rpaforge_libraries.DataFrames.library:DataFrames"
OCR = "rpaforge_libraries.OCR.library:OCR"
Credentials = "rpaforge_libraries.Credentials.library:Credentials"
Database = "rpaforge_libraries.Database.library:Database"
Queues = "rpaforge_libraries.Queues.library:Queues"
IDP = "rpaforge_libraries.IDP.library:IDP"
Notifications = "rpaforge_libraries.Notifications.library:Notifications"
AI = "rpaforge_libraries.AI.library:AI"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rpaforge_libraries.IDP" = ["schemas/*.json"]
