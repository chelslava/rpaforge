name: Bug report
description: Report a reproducible problem in RPAForge.
title: "[BUG] "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please include enough detail for maintainers to reproduce it.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Describe the bug clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: List the exact steps needed to reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: rpaforge-version
    attributes:
      label: RPAForge version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11.0"
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: "Windows 11, Ubuntu 22.04, macOS 14"
    validations:
      required: true
  - type: input
    id: robot-framework-version
    attributes:
      label: Robot Framework version
      placeholder: "7.0"
  - type: textarea
    id: robot-code
    attributes:
      label: Robot file or code sample
      description: Add a minimal example when possible.
      render: robotframework
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant log output.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots if they help explain the issue.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem.
