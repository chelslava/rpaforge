name: Benchmarks

# Nightly performance regression suite (issue #830):
#   - Python: executor activities/sec + SQLite queue enqueue/dequeue rates
#   - Studio: ELK canvas layout at 250/500/1000 nodes + block-store updates
# Each job gates against a committed baseline (20% regression threshold).
#
# Baseline lifecycle:
#   - First run (no baseline file committed): the gate records one and sets
#     `bootstrapped=true`; the job then commits it. Until that commit lands,
#     runs pass with a warning instead of gating.
#   - Hardware change or intentional perf shift: dispatch this workflow with
#     update_baseline=true; the job refreshes and commits both baselines.

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Overwrite committed baselines with this run results'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  python-bench:
    name: Python executor/queue benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: |
          uv venv --python 3.13
          uv pip install -r requirements-dev.txt
          uv pip install -e packages/core
          uv pip install -e packages/libraries

      - name: Run benchmarks
        run: uv run --no-project packages/core/benchmarks/run_all.py --output bench-results/python.json

      - name: Gate against baseline
        id: gate
        run: |
          uv run --no-project python .github/scripts/bench_gate.py \
            --results bench-results/python.json \
            --baseline packages/core/benchmarks/baseline.json \
            --format rpaforge --threshold 0.20

      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-bench-results
          path: bench-results/python.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit baseline (bootstrap or explicit update)
        if: inputs.update_baseline == true || steps.gate.outputs.bootstrapped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/core/benchmarks/baseline.json
          git commit -m "chore(bench): record python baseline [skip ci]"
          git push

  studio-bench:
    name: Studio canvas benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install dependencies
        working-directory: packages/studio
        run: pnpm install --frozen-lockfile

      # bench/results.json is produced next to the suite (gitignored).
      - name: Run benchmarks
        working-directory: packages/studio
        run: pnpm bench

      - name: Gate against baseline
        id: gate
        run: |
          python .github/scripts/bench_gate.py \
            --results packages/studio/bench/results.json \
            --baseline packages/studio/bench/baseline.json \
            --format vitest --threshold 0.20

      - name: Upload results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: studio-bench-results
          path: packages/studio/bench/results.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit baseline (bootstrap or explicit update)
        if: inputs.update_baseline == true || steps.gate.outputs.bootstrapped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/studio/bench/baseline.json
          git commit -m "chore(bench): record studio baseline [skip ci]"
          git push
