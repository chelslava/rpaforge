# Release workflow: builds, validates, and publishes RPAForge packages.
# Triggered automatically when a GitHub Release is published, or manually via
# workflow_dispatch so maintainers can cut a release without creating a tag first.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    # "published" fires when a draft release is published or a new release is
    # created directly; does not fire for drafts or prereleases until published.
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      # contents: write -- needed to upload release assets to the GitHub Release.
      # PyPI publishing (and its id-token: write) lives in the separate
      # publish-pypi job, so a publish failure cannot block the release/installer.
      contents: write

    steps:
      # fetch-depth: 0 fetches the full git history including all tags so that
      # build tools can derive the correct version from git metadata if needed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Verify Python lockfile
        run: uv lock --check

      # Python 3.11 is the build environment; it does not affect the supported
      # runtime versions of the published packages.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Install the PEP 517 build frontend (build) and Twine for package
      # validation and PyPI upload.
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      # Build source distributions (.tar.gz) and wheels (.whl) for both packages.
      # --outdir dist places all artifacts in a single directory for easy handling.
      # core and libraries are built separately because they have independent
      # version numbers and pyproject.toml files.
      - name: Build packages
        run: |
          mkdir -p dist
          python -m build packages/core --outdir dist
          python -m build packages/libraries --outdir dist

      # The community library registry manifest is NOT placed in dist/ because
      # both twine check and the pypi-publish action scan all files in dist/ and
      # would fail on the non-Python registry.json.
      - name: Copy release assets
        run: |
          mkdir -p release-assets
          cp packages/studio/electron/libraries/registry.json release-assets/

      # twine check validates the built distributions against PyPI requirements
      # (correct metadata, valid README rendering, etc.) before any upload attempt,
      # catching packaging errors early in the job.
      - name: Check packages
        run: twine check dist/*

      # Supply-chain artifacts (issue #833): a CycloneDX SBOM covering the whole
      # locked Python dependency tree (workspace packages + all extras, so the
      # torch/pillow cluster is included) and SHA256SUMS over every release
      # asset built in this job. Both attach to the GitHub Release.
      - name: Generate Python SBOM (CycloneDX)
        run: |
          uv export --format cyclonedx1.5 --all-packages --all-extras \
            > release-assets/sbom-python.cdx.json

      - name: Generate checksums
        run: |
          {
            sha256sum dist/*.whl dist/*.tar.gz
            sha256sum release-assets/registry.json release-assets/sbom-python.cdx.json
          } | sed -E 's#  (dist|release-assets)/#  #' > release-assets/SHA256SUMS

      # Hand the validated distributions to the separate publish-pypi job. Keeping
      # the PyPI upload out of this job means a PyPI failure fails loudly on its
      # own without blocking the GitHub Release or the Windows installer.
      # Only dist/ is uploaded — release-assets/ goes directly to the GitHub Release.
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      # Create a GitHub Release and attach the built distribution files.
      # generate_release_notes: true auto-populates the release body from merged
      # PR titles and commit messages since the previous tag.
      # Only runs on manual dispatch so automated release events (which already
      # have a release object) do not create a duplicate release.
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: RPAForge ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            release-assets/registry.json
            release-assets/sbom-python.cdx.json
            release-assets/SHA256SUMS
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, build-electron]
    # Only real releases (tag push or manual dispatch) publish; a "release:
    # published" event skips publishing, matching the previous behaviour.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    permissions:
      # id-token: write -- mints the short-lived OIDC token for Trusted Publishing.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Trusted Publishing (OIDC) — no stored API token. Requires a GitHub
      # trusted publisher configured on PyPI for BOTH rpaforge-core and
      # rpaforge-libraries:
      #   PyPI -> project -> Settings -> Publishing -> add a GitHub publisher
      #     Owner: chelslava   Repository: rpaforge   Workflow: release.yml
      # No `|| echo` mask: a real upload failure fails this job loudly instead of
      # silently shipping a release without the packages. skip-existing keeps
      # re-runs idempotent when a version was already uploaded.
      # attestations: true -- publish PEP 740 provenance attestations alongside
      # the distributions (verifiable on PyPI and via `gh attestation verify`);
      # explicit here because the acceptance for issue #833 depends on it.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          attestations: true

  build-electron:
    name: Build and Attach Windows Installer
    runs-on: windows-latest
    # Run after the Python build job so the GitHub Release already exists
    # before we try to attach the installer to it.
    needs: build
    permissions:
      contents: write
      # id-token + attestations: mint GitHub artifact attestations (sigstore
      # bundles via OIDC, no stored secrets) for the installer (issue #833).
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Verify Python lockfile
        run: uv lock --check

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      # Python is needed to freeze the engine into a standalone executable that
      # ships inside the installer, so end users do not need Python themselves.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Install PyInstaller plus the engine packages. The optional extras decide
      # which RPA activities get bundled. Libraries whose deps are absent degrade
      # gracefully at runtime (the bridge logs a warning and continues).
      # NB: the `ocr` extra is deliberately NOT used — it pulls easyocr/torch
      # (gigabytes, fragile under PyInstaller). The OCR library only needs
      # pytesseract (lazily imported) plus the system tesseract binary bundled
      # below, so we install pytesseract directly instead.
      - name: Install engine build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install ./packages/core
          pip install "./packages/libraries[desktop,web,excel,database,keystore,dataframes]"
          pip install pytesseract

      # WebUI (playwright) needs browser binaries, which pip does not install.
      # Install Chromium into resources/pw-browsers so electron-builder ships it
      # via extraResources; the app sets PLAYWRIGHT_BROWSERS_PATH to this folder
      # at runtime (see electron/main.ts: resolveBridgeLaunchSpec).
      - name: Install Playwright Chromium
        shell: bash
        run: python -m playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/packages/studio/resources/pw-browsers

      # OCR (pytesseract) shells out to the native tesseract binary, which is not
      # a pip package. Install it and copy the program + tessdata into
      # resources/tesseract; the app prepends this folder to PATH and sets
      # TESSDATA_PREFIX at runtime.
      - name: Bundle Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $src = "C:\Program Files\Tesseract-OCR"
          $dst = "packages/studio/resources/tesseract"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Path "$src\*" -Destination $dst -Recurse -Force
          Write-Host "Bundled Tesseract from $src"

      - name: Install dependencies
        working-directory: packages/studio
        run: pnpm install --frozen-lockfile

      # Freeze the engine into resources/bridge/ before electron-builder runs so
      # it is picked up via the `extraResources` config.
      - name: Build Python bridge
        working-directory: packages/studio
        run: pnpm build:bridge

      - name: Build Electron app
        working-directory: packages/studio
        run: pnpm build

      - name: Run packaged Electron E2E smoke suite
        working-directory: packages/studio
        run: pnpm test:e2e

      - name: Upload Electron E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: electron-e2e-failure-artifacts
          path: |
            packages/studio/test-results
            packages/studio/playwright-report

      # Supply-chain artifacts for the installer (issue #833): the npm-side
      # CycloneDX SBOM, a SHA256SUMS file for every built .exe, and a GitHub
      # artifact attestation (sigstore bundle) linking the binaries to this
      # workflow run. All no-secret: the attestation signs with the OIDC
      # identity of this run.
      - name: Generate Studio SBOM (CycloneDX)
        working-directory: packages/studio
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          pnpm sbom --sbom-format cyclonedx \
            > "$GITHUB_WORKSPACE/release-assets/sbom-studio.cdx.json"

      - name: Generate installer checksums
        shell: bash
        run: |
          for f in packages/studio/dist-electron/*.exe; do
            # Normalize Git Bash's binary-mode '*' marker to the standard
            # two-space separator, then strip the build directory prefix so
            # checksum names match the release asset names.
            sha256sum "$f" \
              | sed -E -e 's#\*# #' -e 's#  packages/studio/dist-electron/#  #' \
              >> release-assets/SHA256SUMS-installer.txt
          done

      - name: Attest build provenance (installer)
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: packages/studio/dist-electron/*.exe

      - name: Attach installer to GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: |
            packages/studio/dist-electron/*.exe
            release-assets/sbom-studio.cdx.json
            release-assets/SHA256SUMS-installer.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
