name: Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * *'

# Supply-chain hardening (issue #910): no default token permissions; audit jobs
# declare their scopes below.
permissions: {}

jobs:
  python-audit:
    name: Python Dependencies Audit
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      # Install the exact same environment the test jobs install (including the
      # [idp,dataframes,llm] extras): auditing a different dependency set than
      # the one that ships is how the 2026-10-28 python cluster (69 dependabot
      # alerts in the extras) stayed invisible to CI.
      - name: Install dependencies
        run: |
          uv lock --check
          uv venv --python 3.13
          uv pip install -r requirements-dev.txt
          uv pip install -e "packages/core[otel]"
          uv pip install -e "packages/libraries[idp,dataframes,llm]"

      # Gate (blocks CI): fails on high/critical/unknown advisories that are not
      # allow-listed. The allow-list is dated — expired entries fail the gate.
      # The script also hard-fails if pip-audit itself crashed or wrote no
      # report, so an advisory-service outage never green-lights a release.
      - name: Run pip-audit gate
        run: |
          uv pip install pip-audit
          uv run --no-project python .github/scripts/pip_audit_gate.py --allowlist .github/pip-audit-allowlist.txt --output pip-audit.json

      - name: Upload pip-audit results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit.json
          retention-days: 30
          if-no-files-found: ignore

  npm-audit:
    name: Node.js Dependencies Audit
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11

      - name: Install dependencies
        working-directory: packages/studio
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        working-directory: packages/studio
        run: pnpm audit --json > npm-audit.json 2>&1 || true

      # Gate (blocks CI): fails on critical/high advisories that are not
      # allow-listed. The allow-list is dated — expired entries fail the gate
      # (same policy as the Python pip-audit gate; see npm_audit_gate.mjs).
      - name: Check for critical/high vulnerabilities
        if: always()
        run: node .github/scripts/npm_audit_gate.mjs --audit packages/studio/npm-audit.json --allowlist .github/npm-audit-allowlist.txt
        shell: bash

      - name: Upload npm audit results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: npm-audit-results
          path: packages/studio/npm-audit.json
          retention-days: 30

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [python-audit, npm-audit]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ./audit-results

      - name: Display audit results
        run: |
          echo "## Security Audit Summary"
          echo ""
          
          echo "### Python Dependencies"
          if [ -f ./audit-results/pip-audit-results/pip-audit.json ]; then
            echo "```json"
            cat ./audit-results/pip-audit-results/pip-audit.json
            echo "```"
          else
            echo "No vulnerabilities found or audit skipped"
          fi
          
          echo ""
          echo "### Node.js Dependencies"
          if [ -f ./audit-results/npm-audit-results/npm-audit.json ]; then
            echo "```json"
            cat ./audit-results/npm-audit-results/npm-audit.json
            echo "```"
          else
            echo "No vulnerabilities found or audit skipped"
          fi
